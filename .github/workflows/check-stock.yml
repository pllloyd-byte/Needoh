name: Check NeeDoh stock

# How this works:
# GitHub's own schedule is unreliable for frequent jobs. "Every 5 minutes"
# often turns into "every few hours". So instead, one run stays alive and
# checks the shops every CHECK_EVERY_SECONDS for about 5h40m (GitHub's limit
# is 6 hours per job). Just before it stops, it starts the next run itself, so
# checking carries on around the clock. The schedule below is only a backup
# that restarts the chain if it ever breaks.

on:
  schedule:
    - cron: "*/30 * * * *"   # backup only (see above)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab
    inputs:
      test_notification:
        description: "Just send a test notification to my phone"
        type: boolean
        default: false

permissions:
  contents: write            # lets the job save state.json back to the repo
  actions: write             # lets the job start the next run

concurrency:
  group: needoh-stock-check  # never run two checks at the same time
  cancel-in-progress: false

env:
  CHECK_EVERY_SECONDS: 120   # how often to check the shops (2 minutes)
  KEEP_RUNNING_MINUTES: 340  # how long each run keeps checking before handing over

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python checker.py --test-notification

      - name: Check shops every few minutes
        if: ${{ !inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "needoh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # True if state.json differs from the last saved copy in a way that
          # matters (stock, products, alerts), not just timestamps and counters.
          important_change() {
            python3 - <<'PY'
          import json, subprocess, sys
          NOISE = ("last_success", "consecutive_failures", "last_error")
          def strip(s):
              s = dict(s)
              s["shops"] = {n: {k: v for k, v in d.items() if k not in NOISE}
                            for n, d in s.get("shops", {}).items()}
              return s
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:state.json"]))
          except Exception:
              sys.exit(0)
          new = json.load(open("state.json", encoding="utf-8"))
          sys.exit(0 if strip(old) != strip(new) else 1)
          PY
          }

          # Saves state.json to the repo. Between checks the file stays on disk,
          # so it's only uploaded when something important changed, or at the
          # end of the run ("final").
          save_state() {
            git diff --quiet -- state.json 2>/dev/null && return 0
            [ "$1" = "final" ] || important_change || return 0
            git add state.json
            git commit -q -m "Update stock state"
            for i in 1 2 3 4; do
              git pull --rebase --quiet && git push --quiet && return 0
              sleep $((i * 3))
            done
            echo "::warning::Could not save state.json (will try again next check)"
          }

          end=$(( $(date +%s) + KEEP_RUNNING_MINUTES * 60 ))
          n=0
          while :; do
            n=$((n + 1))
            start=$(date +%s)
            echo "::group::Check $n at $(date -u +%H:%M:%S) UTC"
            timeout 600 python checker.py || echo "::warning::Check $n failed (exit $?)"
            save_state
            echo "::endgroup::"
            next=$(( start + CHECK_EVERY_SECONDS ))
            [ "$next" -ge "$end" ] && break
            now=$(date +%s)
            [ "$next" -gt "$now" ] && sleep $(( next - now ))
          done
          save_state final
          echo "Finished $n checks."

      - name: Start the next run
        if: ${{ !inputs.test_notification && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-stock.yml --ref "${{ github.ref_name }}"
